[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cotescore"
version = "0.3.0"
description = "Coverage and Overlap, Trespass and Excess (COTe) Testing for Document Layout Analysis"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Jonathan Bourne"},
    {name = "Mwiza Simbeye"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21.0,<2.0",
    "pandas>=1.3.0",
    "pillow>=9.0.0",
    "datasets>=2.0.0",
    "matplotlib>=3.5.0",
    "pycocotools>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
]

benchmarks = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=4.46.3",
    "datasets>=2.0.0",
    "huggingface-hub>=0.16.0",
    "evaluate>=0.4.0",
    "tqdm>=4.65.0",
    "marimo>=0.8.22",
    "requests>=2.32.4",
    "jinja2>=3.1.6", #For latex tables
    # PP-DocLayout-L — PaddlePaddle itself must be installed separately first:
    # pip install paddlepaddle==3.0.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
    #"paddleocr>=2.9.0",
]

models = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

pipeline = [
    "apache-beam>=2.69.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "pytesseract>=0.3.10",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "easyocr>=1.7.0",
    #"paddleocr>=2.9.0",
    # paddlepaddle (CPU or GPU) must be installed separately before paddleocr:
    #   CPU: uv pip install paddlepaddle
    #   GPU: uv pip install paddlepaddle-gpu -i https://www.paddlepaddle.org.cn/packages/stable/cu123/
]

paddle-benchmark = [
    # benchmark deps only, no torch
    "datasets>=2.0.0",
    "huggingface-hub>=0.16.0",
    "evaluate>=0.4.0",
    "tqdm>=4.65.0",
    "marimo>=0.8.22",
    "requests>=2.32.4",
    "paddleocr>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/JonnoB/cot_analysis"
Repository = "https://github.com/JonnoB/cot_analysis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cotescore = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "marimo>=0.17.6",
    "pytest>=8.4.2",
]
pipeline = [
    "apache-beam>=2.69.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "pytesseract>=0.3.10",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "easyocr>=1.7.0",
    "paddleocr>=2.9.0",
    "paddlepaddle>=3.0.0",
    # For GPU on Lightning AI (CUDA 13.0), reinstall paddlepaddle after uv sync:
    #   uv pip install paddlepaddle-gpu -i https://www.paddlepaddle.org.cn/packages/stable/cu130/ --reinstall
]

# Install both groups when running plain `uv sync`
# torch/torchvision are installed as CPU wheels from PyPI by default.
# For GPU on Lightning AI (CUDA 13.0), run this after uv sync:
#   uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu130 --reinstall
[tool.uv]
default-groups = ["dev", "pipeline"]
